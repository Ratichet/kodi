name: CD – Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install VLC
        run: choco install vlc --no-progress -y

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # La mise à jour automatique compare APP_VERSION au tag : un écart ferait
      # proposer la même mise à jour à chaque lancement.
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from core.config import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "APP_VERSION ($version) ne correspond pas au tag ${{ github.ref_name }}"
          }

      # Même script qu'en local : les options PyInstaller ne vivent qu'à un endroit.
      # Un dossier plutôt qu'un exécutable unique : démarrage rapide, et c'est le
      # format que la mise à jour automatique sait remplacer.
      - name: Build with PyInstaller
        shell: pwsh
        run: python tools/build.py --onedir

      # Racine de l'archive = dossier EpiKodi/, attendu par core/services/updater.py.
      - name: Zip the application folder
        shell: pwsh
        run: python -c "import shutil; shutil.make_archive('dist/EpiKodi-windows', 'zip', 'dist', 'EpiKodi')"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpiKodi-windows
          path: dist/EpiKodi-windows.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            vlc libvlc-dev libgl1 libegl1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Même script que sur Windows : il n'embarque VLC que là où c'est nécessaire.
      - name: Build with PyInstaller
        run: python tools/build.py

      - name: Make executable
        run: chmod +x dist/EpiKodi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpiKodi-linux
          path: dist/EpiKodi

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-windows, build-linux ]

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: EpiKodi-windows
          path: release/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: EpiKodi-linux
          path: release/

      - name: Rename artifacts with version
        run: |
          TAG=${GITHUB_REF_NAME}
          mv release/EpiKodi-windows.zip release/EpiKodi-${TAG}-windows.zip
          mv release/EpiKodi     release/EpiKodi-${TAG}-linux

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          CHANGELOG=.github/CHANGELOG.md
          if [ -s "$CHANGELOG" ]; then
            NOTES=$(awk "/^## \[?${TAG}\]?/{found=1; next} found && /^## /{exit} found{print}" "$CHANGELOG")
          else
            NOTES="Release ${TAG}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EpiKodi ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            release/EpiKodi-*-windows.zip
            release/EpiKodi-*-linux
